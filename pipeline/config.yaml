# Jiheeye Ultra UGC pipeline config. Paths are relative to pipeline/ unless
# they are absolute. Anything marked VERIFY was not confirmed against the live
# API when written; `python run.py preflight` checks it for you before any
# paid call.

backend: modal                   # modal = Demucs + final assembly run on Modal (closed decision 2026-09-27).
                                 # local is ONLY for tests/test_offline.py synthetic media, and run.py
                                 # additionally requires JIHEEYE_ALLOW_LOCAL=1 in the environment.

paths:                           # scratch tree on D:. run.py refuses anything outside this root
  runs_dir: /mnt/d/scratch/jiheeye-ultra/runs   # (doctrine 8: scratch failure stops work, never C:).
  work_dir: /mnt/d/scratch/jiheeye-ultra/work

voice:
  prep:
    source_clips:                 # YOUR OWN recordings/videos. 1-3 min of clean talking total.
      - assets/voice/raw/clip1.mp4
    demucs: true                  # Mayo's clips have a music bed (brief 01 fact); Demucs runs on Modal now.
    denoise_strength: 0.85        # 0-1. Lower if the voice starts sounding robotic.
    min_seconds: 30
    max_seconds: 180
  clone:
    name: jiheeye-owner-voice
    description: "Owner's own voice, Somali, deadpan advice style"

tts:
  model_id: eleven_v3             # the ElevenLabs model whose language list includes Somali
  voice_settings:                 # VERIFY: tune by ear after the first run
    stability: 0.5
    similarity_boost: 0.85

lipsync:
  model: veed/fabric-1.0          # image + audio -> talking video, up to 60s, 480p/720p
  avatar_image: assets/avatar.png # must be an image you own or have rights to
  max_audio_seconds: 60
  inputs:                         # VERIFY key names; preflight prints what the model accepts
    image: "@avatar"
    audio: "@audio"
    resolution: "720p"

broll:
  model: kwaivgi/kling-v2.1       # image-to-video; swap for wan-video/wan-2.2-i2v-fast to cut cost
  inputs:                         # VERIFY key names; preflight prints what the model accepts
    start_image: "@image"
    prompt: "$prompt"
    duration: 5

captions:
  burn: true
  words_per_caption: 3
  font: DejaVu Sans               # WSL2: sudo apt install fonts-dejavu-core
  size: 16
  colour: "&H0000FFFF"            # ASS colour, &HAABBGGRR -> yellow
  outline: 2
  margin_v: 60

music:
  file: ""                        # e.g. assets/music/bed.mp3 (royalty-free only). Empty = no music.
  volume: 0.12

output:
  width: 1080
  height: 1920
  fps: 30
  loudness_lufs: -14
  max_seconds: 60
  max_mb: 250
